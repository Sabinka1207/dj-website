# Server
server.port=${PORT:8080}

# CORS - allow requests from local React dev server
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,https://dj-sabi.com,https://www.dj-sabi.com,https://${VERCEL_URL:dj-sabi.com}

# Resend email API
app.resend.api-key=${RESEND_API_KEY:}

# Contact form - where to send enquiries
app.contact.recipient-email=${CONTACT_EMAIL:}

# Telegram Bot (fill in your bot token and chat ID)
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Database (H2 in-memory for local dev, overridden by env vars on Render)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:djsabi;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true

# Admin panel
app.admin.password=${ADMIN_PASSWORD:changeme}
app.admin.google.email=${ADMIN_GOOGLE_EMAIL:}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
