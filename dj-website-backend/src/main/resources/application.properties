# Server
server.port=${PORT:8080}

# CORS - allow requests from local React dev server
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,https://dj-sabi.com,https://www.dj-sabi.com,https://${VERCEL_URL:dj-sabi.com}

# Resend email API
app.resend.api-key=${RESEND_API_KEY:}

# Contact form - where to send enquiries
app.contact.recipient-email=${CONTACT_EMAIL:}

# Telegram Bot (fill in your bot token and chat ID)
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Database (H2 in-memory for local dev, overridden by env vars on Render)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:djsabi;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP - limit pool size for PgBouncer Session mode on Render
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.main.lazy-initialization=true

# Site URL (used in Telegram notifications)
app.site.url=${SITE_URL:https://dj-sabi.com}

spring.flyway.baseline-on-migrate=true

# Admin panel
app.admin.password=${ADMIN_PASSWORD:changeme}
app.admin.google.email=${ADMIN_GOOGLE_EMAIL:}

# Cloudinary (cover images)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Cloudflare R2 (mix audio files)
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.public-url=${R2_PUBLIC_URL:}
# Cloudflare API token (for R2 analytics — Class A/B ops)
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}

# File uploads — allow large MP3s (up to 200 MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
# Write files to disk immediately — never buffer upload data in heap
spring.servlet.multipart.file-size-threshold=0
